services:
  db:                                       
    image: postgres:16
    container_name: fmcg_postgres            
    restart: unless-stopped                  
    environment:                             
      POSTGRES_USER: ${POSTGRES_USER}         
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}             
    ports:
      - "5432:5432"                          
    volumes:
      - fmcg_pgdata:/var/lib/postgresql/data  

volumes:
  fmcg_pgdata:                               
