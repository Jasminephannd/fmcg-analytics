services:
  db:                                       # Postgres
    image: postgres:16
    container_name: fmcg_postgres            
    restart: unless-stopped                  
    environment:                             
      POSTGRES_USER: ${POSTGRES_USER}         
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} 
      POSTGRES_DB: ${POSTGRES_DB}             
    ports:
      - "5432:5432"
    volumes:
      - fmcg_pgdata:/var/lib/postgresql/data

  app:                                        # the Python pipeline
    build: .                                  # builds the Dockerfile in this folder
    depends_on:
      - db
    env_file: .env
    environment:
      POSTGRES_HOST: db                       
    volumes:
      - ./data:/app/data                     
      - ./src:/app/src                       
      - ./sql:/app/sql                        

volumes:
  fmcg_pgdata:
